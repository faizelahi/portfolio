<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Faiz Elahi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #040914;
    --accent: #00b7ff;
    --accent-2: #0077cc;
    --muted: #7f8ea3;
    --glass: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: #dfefff;
    margin: 0; padding: 0;
  }
  .container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
    background: var(--glass);
    border-radius: 16px;
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
  }
  h1 { text-align:center; margin-bottom:20px; }
  .flex { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  button, .add-btn {
    padding: 8px 14px; border-radius:8px; border:none; cursor:pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color:#001d2b; font-weight:600; transition:0.3s ease;
  }
  button:hover, .add-btn:hover { transform: translateY(-2px); box-shadow:0 0 16px rgba(0,183,255,0.3); }
  input, textarea, select {
    padding: 8px; border-radius:6px; border:1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05); color:#dfefff; width:100%; font-family:inherit;
  }
  table {
    width:100%; border-collapse: collapse; margin-top:20px;
  }
  th, td {
    padding: 10px; text-align:left; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .actions button {
    margin-right: 6px;
    background: rgba(255,255,255,0.08); color:#00b7ff;
  }
  .actions button.delete { background: rgba(255,0,0,0.2); color:#ff8080; }
  .actions button:hover { opacity:0.8; }
  .form-popup { display:none; background: rgba(255,255,255,0.04); padding:20px; border-radius:12px; margin-top:20px; }
  .form-popup.show { display:block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
</style>
</head>
<body>
<div class="container">
  <h1>Admin Panel - Content Manager</h1>
  <div class="flex">
    <button class="add-btn" id="addNewBtn">+ Add New Post</button>
    <input type="text" id="searchInput" placeholder="Search posts..." style="flex:1;">
    <select id="sortSelect">
      <option value="date">Sort by Date</option>
      <option value="title">Sort by Title</option>
      <option value="category">Sort by Category</option>
    </select>
    <button id="exportBtn">Export JSON</button>
  </div>

  <div class="form-popup" id="formPopup">
    <h3 id="formTitle">Add New Post</h3>
    <input type="hidden" id="postId">
    <label>Title</label>
    <input type="text" id="title" placeholder="Post title">
    <label>Category</label>
    <input type="text" id="category" placeholder="Category">
    <label>Tags (comma separated)</label>
    <input type="text" id="tags" placeholder="tag1,tag2">
    <label>Content</label>
    <textarea id="content" rows="5" placeholder="Write your content"></textarea>
    <label>Image URL (optional)</label>
    <input type="text" id="image" placeholder="Paste image URL">
    <div class="flex" style="margin-top:10px;">
      <button id="saveBtn">Save</button>
      <button id="cancelBtn" style="background:rgba(255,255,255,0.08); color:#ff8080;">Cancel</button>
    </div>
  </div>

  <table id="postsTable">
    <thead>
      <tr><th>Title</th><th>Category</th><th>Tags</th><th>Date</th><th>Actions</th></tr>
    </thead>
    <tbody id="postsBody">
      <!-- Posts will be inserted here -->
    </tbody>
  </table>
</div>

<script>
  let posts = JSON.parse(localStorage.getItem('posts')) || [];

  const addNewBtn = document.getElementById('addNewBtn');
  const formPopup = document.getElementById('formPopup');
  const formTitle = document.getElementById('formTitle');
  const postId = document.getElementById('postId');
  const title = document.getElementById('title');
  const category = document.getElementById('category');
  const tags = document.getElementById('tags');
  const content = document.getElementById('content');
  const image = document.getElementById('image');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const postsBody = document.getElementById('postsBody');
  const searchInput = document.getElementById('searchInput');
  const sortSelect = document.getElementById('sortSelect');
  const exportBtn = document.getElementById('exportBtn');

  function renderPosts() {
    let filtered = posts.filter(p => 
      p.title.toLowerCase().includes(searchInput.value.toLowerCase()) ||
      p.content.toLowerCase().includes(searchInput.value.toLowerCase()) ||
      p.category.toLowerCase().includes(searchInput.value.toLowerCase())
    );

    const sortValue = sortSelect.value;
    if(sortValue==='title') filtered.sort((a,b)=> a.title.localeCompare(b.title));
    if(sortValue==='category') filtered.sort((a,b)=> a.category.localeCompare(b.category));
    if(sortValue==='date') filtered.sort((a,b)=> b.date - a.date);

    postsBody.innerHTML = filtered.map(p=>`
      <tr>
        <td>${p.title}</td>
        <td>${p.category}</td>
        <td>${p.tags.join(', ')}</td>
        <td>${new Date(p.date).toLocaleDateString()}</td>
        <td class="actions">
          <button onclick="editPost(${p.id})">Edit</button>
          <button class="delete" onclick="deletePost(${p.id})">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  function savePost() {
    const id = postId.value;
    const newPost = {
      id: id ? parseInt(id) : Date.now(),
      title: title.value,
      category: category.value || 'General',
      tags: tags.value.split(',').map(t=>t.trim()).filter(t=>t),
      content: content.value,
      image: image.value,
      date: id ? posts.find(p=>p.id==id).date : Date.now()
    };

    if(id){
      posts = posts.map(p=>p.id==id? newPost:p);
    } else {
      posts.unshift(newPost);
    }
    localStorage.setItem('posts', JSON.stringify(posts));
    formPopup.classList.remove('show');
    clearForm();
    renderPosts();
  }

  function editPost(id){
    const p = posts.find(p=>p.id===id);
    postId.value = p.id;
    title.value = p.title;
    category.value = p.category;
    tags.value = p.tags.join(', ');
    content.value = p.content;
    image.value = p.image;
    formTitle.textContent = "Edit Post";
    formPopup.classList.add('show');
  }

  function deletePost(id){
    if(confirm('Are you sure to delete this post?')){
      posts = posts.filter(p=>p.id!==id);
      localStorage.setItem('posts', JSON.stringify(posts));
      renderPosts();
    }
  }

  function clearForm(){
    postId.value = '';
    title.value = '';
    category.value = '';
    tags.value = '';
    content.value = '';
    image.value = '';
    formTitle.textContent = "Add New Post";
  }

  addNewBtn.addEventListener('click', ()=>{ formPopup.classList.add('show'); clearForm(); });
  cancelBtn.addEventListener('click', ()=>{ formPopup.classList.remove('show'); });
  saveBtn.addEventListener('click', savePost);
  searchInput.addEventListener('input', renderPosts);
  sortSelect.addEventListener('change', renderPosts);
  exportBtn.addEventListener('click', ()=>{ 
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(posts,null,2));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", "posts.json");
    a.click();
  });

  renderPosts();
</script>
</body>
</html>
